<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Registro de Usuario</h1>
                <p>Crea una cuenta para comenzar</p>
            </div>
            
            <form id="registerForm" class="form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-container">
                        <input type="email" id="email" name="email" required>
                        <i class="fas fa-envelope icon"></i>
                    </div>
                    <div id="emailValidation" class="validation-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-container">
                        <input type="password" id="password" name="password" minlength="8" required>
                        <i class="fas fa-lock icon"></i>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-segment" id="strength-segment-1"></div>
                            <div class="strength-segment" id="strength-segment-2"></div>
                            <div class="strength-segment" id="strength-segment-3"></div>
                            <div class="strength-segment" id="strength-segment-4"></div>
                        </div>
                        <div id="passwordStrengthText" class="strength-text"></div>
                    </div>
                    <div id="passwordValidation" class="validation-message"></div>
                </div>
                
                <div class="form-group">
                    <button type="button" id="generatePassword" class="btn-secondary">
                        <i class="fas fa-key"></i> Generar contraseña segura
                    </button>
                </div>
                
                <button type="submit" class="btn-primary" id="submitBtn">
                    <span class="btn-text">Registrarse</span>
                    <div class="loader" id="loader">
                        <div class="loader-circle"></div>
                        <div class="loader-circle"></div>
                        <div class="loader-circle"></div>
                    </div>
                </button>
            </form>
        </div>
        
        <div class="success-message" id="successMessage">
            <div class="success-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"></path>
                </svg>
            </div>
            <h2>¡Registro exitoso!</h2>
            <p>Tu cuenta ha sido creada correctamente.</p>
            <button id="resetForm" class="btn-primary">Volver al formulario</button>
        </div>
    </div>
    
    <footer>
        <p>DESARROLLADO POR ERICK PROGRAMADOR</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
